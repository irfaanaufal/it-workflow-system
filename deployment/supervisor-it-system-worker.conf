# ============================================================
# Supervisor Config untuk it-system Queue Worker
# Letakkan di: /etc/supervisor/conf.d/it-system-worker.conf
# ============================================================

[program:it-system-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/it-system/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/it-system/storage/logs/worker.log
stopwaitsecs=3600
